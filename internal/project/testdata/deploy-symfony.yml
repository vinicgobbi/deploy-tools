# Gerado por deploy-dev v1.2.0 (deploy-dev init). Pode editar à
# vontade; rode "deploy-dev check" para validar contra as convenções.
name: Release and deploy

on:
  push:
    branches:
      - main

env:
  APP_NAME: loja

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none

      # O servidor tem as extensões de produção; o runner só precisa
      # validar e montar o vendor/, sem executar a aplicação.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req='ext-*' --no-scripts

      - name: Check PHP syntax
        run: find src config migrations public -name '*.php' -print0 | xargs -0 -n50 -P4 php -l > /dev/null

      # Reaproveita o vendor/ já baixado: remove os pacotes de dev e
      # regenera o autoload otimizado.
      - name: Prune dev dependencies
        env:
          APP_ENV: prod
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader --no-scripts --ignore-platform-req='ext-*'

      # O cache (var/cache) é gerado no servidor, no caminho da release; aqui
      # só os arquivos públicos dos bundles e o AssetMapper.
      - name: Build public assets
        env:
          APP_ENV: prod
          APP_DEBUG: "0"
        run: |
          php bin/console assets:install public --no-interaction
          php bin/console asset-map:compile

      - name: Package release
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./tests' \
            --exclude='./node_modules' \
            --exclude='./var' \
            --exclude='./.env.local' \
            --exclude='./.env.*.local' \
            --exclude='./.env.test' \
            --exclude='./phpunit.xml' \
            --exclude='./phpunit.xml.dist' \
            --exclude='./phpunit.dist.xml' \
            --exclude='./.php-cs-fixer.cache' \
            --exclude='./cz.toml' \
            --exclude='./.cz.toml' \
            --exclude='./body.md' \
            --exclude='./*.code-workspace' \
            --exclude='./package.json' \
            --exclude='./package-lock.json' \
            --exclude='./pnpm-lock.yaml' \
            --exclude='./pnpm-workspace.yaml' \
            --exclude='./vite.config.js' \
            --exclude='./vite.config.ts' \
            --exclude='./webpack.config.js' \
            .

      # Gera o release id (timestamp + sufixo), monta a chave num diretório
      # temporário e envia o tarball ao deploy-ci do servidor.
      - name: Deploy
        uses: vinicgobbi/deploy-tools@66ac5741e772bfd2c2afb58b1d36527da520f3f6 # v1.2.0
        with:
          app: ${{ env.APP_NAME }}
          archive: ${{ runner.temp }}/release.tar.gz
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host-key: ${{ secrets.DEPLOY_HOST_KEY }}
