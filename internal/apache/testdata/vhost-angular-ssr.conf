<VirtualHost *:80>
    ServerName app.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName app.example.com

    DocumentRoot /var/www/app/current/browser

    # Angular SSR: os arquivos do build (browser/) saem direto do Apache; o
    # resto é renderizado pelo Node (deploy-tools-app.service).
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^/(.*)$ http://127.0.0.1:4001/$1 [P,L]
    ProxyPassReverse / http://127.0.0.1:4001/

    SSLEngine on
    SSLCertificateFile /c.crt
    SSLCertificateKeyFile /c.key

    ErrorLog ${APACHE_LOG_DIR}/app-error.log
    CustomLog ${APACHE_LOG_DIR}/app-access.log combined
</VirtualHost>

<Directory /var/www/app/>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
