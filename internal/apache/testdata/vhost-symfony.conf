<VirtualHost *:80>
    ServerName app.example.com
    ServerAlias www.app.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName app.example.com
    ServerAlias www.app.example.com

    DocumentRoot /var/www/app/current/public

    SSLEngine on
    SSLCertificateFile /c.crt
    SSLCertificateKeyFile /c.key
    SSLCertificateChainFile /c.chain

    ErrorLog ${APACHE_LOG_DIR}/app-error.log
    CustomLog ${APACHE_LOG_DIR}/app-access.log combined
</VirtualHost>

<Directory /var/www/app/current/public/>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # Rotas do Symfony sem depender do .htaccess (symfony/apache-pack)
    FallbackResource /index.php
</Directory>
